[project]
name = "compass-stock-agent"
version = "0.1.0"
description = "Automated stock chart analysis via screenshots"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "generators",  # pip install git+https://github.com/belarusian/generators.git
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
stock = "compass.stock_agent.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["compass*"]
